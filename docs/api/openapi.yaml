    post:
      operationId: claimStamp
      tags:
      - 휴게소·스탬프
      summary: 휴게소 방문·스탬프 검증 요청
      description: '**상태:** 설계 초안 · **접근:** 현재 커플 연결 필수


        자동·수동 모두 같은 서버 GPS 증거를 사용한다. 해당 주행의 서버 수신 GPS가 휴게소 반경200m 안·정확도50m 이하여야 하며 검색 선택·클라이언트 좌표만으로 지급하지 않는다. 증거
        종료+900초까지 증거가 없으면 접수된 PENDING을 REJECTED로 확정한다. 검증 창이 닫힌 뒤 새 요청에 기존 도장과 증거가 모두 없으면 422 STAMP_LOCATION_NOT_VERIFIED를 반환한다. coupleId+restAreaId로 중복을 막아 기존 도장은 같은 stamp와 alreadyEarned=true를
