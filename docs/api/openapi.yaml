  sourceIssue: Figma 가입 화면에 성별·만난 날(건너뛰기)·붕붕이 이름이 있다. 필수 수집 여부와 두 사용자가 다른 값을 입력했을 때 공동 초기값은 미정.
  owner: 기획·인증·프론트·백엔드
  affected: 가입·커플 연결·이름 변경
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 가입 본문의 nickname·birthDate·consents 키는 필수이며 birthDate 값은 미수집 시 null로 전달할 수 있다. 필수 동의는 TERMS/PRIVACY다.
    성별·만난 날·붕붕이 이름은 선택이며 미수집 성별은 null이다. 커플 연결 시 코드 발급자의 가입 후보값을 우선 사용하고 없으면 참가자 후보값, 둘 다 없으면 이름은 붕붕이·시작일은 연결일로
    둔다. 연결일은 D+1이며 미래 시작일은 허용하지 않는다. 복구는 기존 공동 이름·시작일을 덮어쓰지 않는다.
- id: D21
  priority: P0
  title: 회원 탈퇴·공유 기록·외부 연결 정리
  sourceIssue: 기존 검토는 독립 탈퇴 화면이 없다는 이유로 계정 정리와 본인 재인증을 제외했다. 이는 기능 생명주기·사용자 데이터 권한 검토가 누락된 판단이다.
  owner: 기획·인증 담당·프론트·백엔드
  affected: 회원 탈퇴·재인증·공유 기록·공급자 연결
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 탈퇴는 본인 재인증 뒤 수행하며 로그아웃·커플 해제와 구분한다. 준비/진행 주행이 있으면 먼저 종료·취소해야 한다. 카카오 및 연결된 음악 공급자의 권한 해제를 확인한 뒤 서비스
    계정·전체 세션·푸시를 비활성화하고 커플을 해제한다. 본인 프로필·개인 보관 관계·사연·본인이 작성한 소감/업로드의 접근을 즉시 차단하고 활성 저장소에서24시간 안에 정리한다. 상대방 작성 콘텐츠를
    연쇄 삭제하지 않으며 공유 관계 접근은 D04를 따른다. 공급자 해제 실패는503 retryable=true로 반환하고 탈퇴 완료로 처리하지 않으며 같은 사용자·증명으로 유효기간 안 재시도한다.204는
    계정 비활성화와 공급자 해제가 확인된 경우만 반환한다. 백업 복원 시에도 삭제 대상 재노출을 막고 실제 개인정보 고지·법정 보존 예외는 별도 운영 문안 검증을 거친다. 이미 권한 해제된 공급자는
    재시도 시 성공으로 간주하여 부분 성공 때문에 탈퇴가 반복 실패하지 않게 한다.
    탈퇴 회원이 기록 사용자였던 주행의 개별 GPS 좌표도 활성 저장소에서24시간 안에 삭제한다.
- id: D22
  priority: P0
  title: 성장 제외 후 스탬프 용량·과거 이동 궤적 조회
  sourceIssue: 사용자가 성장 관련9개 API 제외를 확정했다. ON p7 레벨 연동 도장판 요구의 대체 용량 기준과 과거 실제 이동 궤적 조회 제공 여부는 별도 미정이다.
  owner: 기획·프론트·백엔드
  affected: 스탬프 용량 기준·과거 경로 조회
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 성장·XP·업적·꾸미기·보상9개 API는 이번 범위에서 제외한다. 도장판의 레벨별 잠금·5칸 확장은 적용하지 않고 현재 서비스 중인 전체 휴게소 카탈로그를 제공한다. capacity=catalogCount이며
    빈 카탈로그면0이다. 과거 실제 이동 궤적 조회 API는 제공하지 않고 기록 지도는 목적지 사진 마커로 구성한다. GPS 수집·서버 거리 계산은 유지한다.
- id: D23
  priority: P1
  title: 주행 재진입·위치 권한·GPS 누락 처리
  sourceIssue: 주행·GPS 개발 중 확인한 재진입, 신호 단절, 위치 권한 변경 및 GPS 누락 처리에 대한 팀 합의.
  owner: 기획·프론트·백엔드
  affected: 주행 중 화면·준비 세션 취소·홈 배너·GPS 업로드
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-11'
  decision: GPS 신호가 일정 시간 끊기면 드라이브 중단 화면을 자동으로 표시한다. 위치 권한이 꺼지면 안내 팝업을 띄우고 사용자가 권한을 끈 상태로 두겠다고 확인하면 드라이브 화면에서 나가게 한다.
    주행을 시작하기 전에 앱을 닫으면 준비 세션을 취소한다. 커플 중 한 명이 주행 중일 때 상대가 앱을 열면 홈에 진행 중인 드라이브 배너를 표시한다.
    GPS 좌표가 중간에 누락되면 해당 좌표를 건너뛰고 이후 좌표를 계속 전송하고 반영한다.
    GPS 신호 대기 시간, 서버 상태 전이 여부, 취소 요청을 보낼 수 없는 강제 종료 시 정리 방식은 별도 확정한다.
