  /auth/token:
    post:
      operationId: exchangeSocialCode
      tags:
      - 인증·회원
      summary: 소셜 코드 교환·서비스 로그인
      description: '**상태:** 설계 초안 · **접근:** 공개 · 화면 기능 구현을 위한 지원 API


        LOGIN 목적의 서버 발급 authSessionId만 허용. code/state/PKCE/redirectUri 바인딩을 검증하고 OAuth 코드는 1회 소모. 서버가 isNewUser와
        onboardingCompleted 반환. 예시 토큰은 더미다.


        **근거:** OFF p15 로그인 화면 · [Figma 13:442](https://www.figma.com/design/iVcryRTtlYHzHq2JM5wyHQ/?node-id=13-442)


        **확정 정책:** D09 카카오 인증·가입 동의'
      parameters:
