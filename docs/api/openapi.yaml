# 계약 원본. 사용자 정책17건 확정, 2026-11-07. 실제 업무 API 구현은 별도 검증합니다.
openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: 붕붕어스 전체 API 명세
  version: 0.4.0-draft
  description: '프론트·백엔드 구현용 **설계 계약 v0.4.0**입니다. API101개, 사용자 확정 정책18건입니다. 정책은 사용자 승인되었으며 실제 업무 API
    구현·외부 연동은 검증 전입니다. 이 YAML이 계약 원본입니다.


    ### 확정 범위와 정책

    - 로그인은 카카오만 제공합니다. 성장·XP·업적·꾸미기·보상9개 및 분위기 스티커·별도 감사 카드는 제외합니다.

    - 보관 취소·첨부 사진 제거·미첨부 업로드 취소·초대 폐기·회원 탈퇴는 유지합니다.

    - 목적지 설정 뒤 GPS 주행 시작. 서버 도착 반경100m·정확도50m·체류30초, 종료 후 지연 GPS15분, 게임5문항입니다.

    - 카드 작성·수정은 최초 종료+24시간 이내. 사진1장 또는 제출 소감1개로 complete해야 기록에 보존합니다. 완료하지 않은 초안은 만료됩니다.

    - 도장판은 레벨 잠금 없이 전체 카탈로그를 제공하며 capacity=catalogCount입니다.

    - 커플 해제는 공유 접근 차단, 같은 상대의 복구는 보존 기록·이름·시작일 유지. 카드 삭제는 공동 삭제, 회원 탈퇴는 별도 계정 정리입니다.

    - 음악은 공급자 연동 검증 전 musicPlayback=false. 정책 확정을 실제 재생 지원 완료로 간주하지 않습니다.

    - 확정 정책은 x-policy-decisions에서 확인할 수 있습니다.


    ### 공통 규칙

    - 공개 API 이외에는 Authorization: Bearer 토큰을 전달하며 소유권·현재 커플 권한은 서버가 매 요청 검사합니다.

    - X-Couple-Id는 오래된 연결 화면의 쓰기를 막습니다. Idempotency-Key는 같은 의도의 재시도에 같은 키를 사용합니다(일반24시간, refresh 회전 재시도30초).

    - expectedVersion 불일치는409 후 재조회. 주행 controlVersion·카드 version·본인 소감 version·커플 version을 구분합니다.

    - 성공 {data, meta}, 오류 {error, meta};204는 본문 없음,202는 작업 접수입니다.

    - 필수 키와 null 허용은 별개입니다. 생략은 변경 없음이며 미정의 쓰기 필드는 거절합니다.

    - 시각은 UTC RFC3339, 업무 날짜 Asia/Seoul, 좌표 WGS84, 거리m·시간초·파일byte. 재생 위치만ms입니다.

    - 페이지 hasMore=false이면 nextCursor=null. 같은 검색 조건의 커서만 재사용합니다.

    - 사진2장·소감70자·사연300자·최근검색30건·추천7곳·휴게소메뉴4개. 파일10MiB, JPEG/PNG/WebP입니다.

    - 사진은 앨범 선택→업로드 발급→스토리지 PUT→완료 검증→photoIds 저장. 스토리지에는 requiredHeaders만 전달합니다.

    - Job은 진행 상태에서만 retryAfterSeconds 이후 재조회하고 종료하면 중단합니다.


    근거는 DriveOn18쪽·DriveOff16쪽과 Figma, 이후 사용자 확정입니다. 실제 약관·개인정보 고지 문안과 공급자 연동·GPS 현장 검증은 별도입니다.

    '
