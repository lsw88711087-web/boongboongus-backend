  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 커플당 PREPARING/ACTIVE/PAUSED 주행은 합쳐서 최대1개다. driver·passenger는 현재 두 멤버이며 서로 달라야 한다. recorder는 두 멤버 중 한
    명이고 GPS는 그 사용자만 제출한다. 시작은 recorder만 가능하고 시작 뒤 역할·recorder는 바꾸지 않는다. 제목·경로·일시중단·재개·종료는 두 멤버 모두 최신 controlVersion으로
    조작한다. 준비/진행 주행이 있으면 커플 해제·탈퇴는409로 거절하고 먼저 종료 또는 준비 취소한다. 동시 쓰기는 버전 검사로 충돌을 반환한다.
- id: D20
  priority: P1
