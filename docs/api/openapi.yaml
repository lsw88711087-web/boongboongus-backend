    PlaybackRequest:
      type: object
      properties:
        action:
          type: string
          example: PLAY
          description: ''
          enum:
          - PLAY
          - PAUSE
          - NEXT
          - PREVIOUS
        deviceId:
          type: string
          example: device_01
          description: 서버 발급 불투명 ID. 타입·순서를 추론하지 않는다.
          minLength: 1
          maxLength: 80
        playlistId:
          type: string
          example: ply_01
          description: 서버 발급 불투명 ID. 타입·순서를 추론하지 않는다.
          minLength: 1
          maxLength: 80
        trackId:
          type: string
          example: trk_01
          description: 서버 발급 불투명 ID. 타입·순서를 추론하지 않는다.
          minLength: 1
          maxLength: 80
        scope:
          type: string
          enum:
          - TRACK
          - PLAYLIST
          example: TRACK
      required:
      - action
      - deviceId
      additionalProperties: false
      description: PLAY+TRACK는 trackId 한 곡만 재생하고 종료한다. PLAY+PLAYLIST는 첫 곡부터 전체 목록을 재생한다. PAUSE/NEXT/PREVIOUS는 현재
        재생 대상에 적용한다. 서버 제어/SDK 방식은 D10 확인.
      allOf:
      - if:
          properties:
            action:
              const: PLAY
          required:
          - action
        then:
          required:
          - playlistId
          - scope
      - if:
          properties:
            action:
              const: PLAY
            scope:
              const: TRACK
          required:
          - action
          - scope
        then:
          required:
          - trackId
      - if:
          properties:
            action:
              const: PLAY
            scope:
              const: PLAYLIST
          required:
          - action
          - scope
        then:
          not:
            required:
            - trackId
      - if:
          properties:
            action:
              enum:
              - PAUSE
              - NEXT
              - PREVIOUS
          required:
          - action
        then:
          not:
            anyOf:
            - required:
              - playlistId
            - required:
              - trackId
            - required:
              - scope
