      summary: 도착·수동 주행 종료
      description: '**상태:** 설계 초안 · **접근:** 현재 커플 연결 필수 · 화면 기능 구현을 위한 지원 API


        현재 두 멤버가 최신 controlVersion으로 ACTIVE/PAUSED→ENDED를 수행할 수 있다. ARRIVED는 서버가 반경100m·정확도50m 이하·샘플 간격15초 이하로30초
        연속 체류를 검증한다. 조건 미충족이면 도착으로 끝내지 않는다. USER_ENDED도 시작된 주행이면 canCreateCard=true이고 준비 취소는 카드가 없다. endedAt과 editableUntil=endedAt+24h는
        최초1회 고정한다. 종료 시 진행 중 게임을 ABANDONED로 정리한다. 지연 GPS는 endedAt 이전 ACTIVE 구간에 한해 종료+900초까지 반영하며 카드의 마감이나 사용자 편집
