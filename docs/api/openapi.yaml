  /drives/{driveId}:
    get:
      operationId: getDrive
      tags:
      - 주행·GPS
      summary: 드라이브 상태·요약 조회
      description: '**상태:** 설계 초안 · **접근:** 현재 커플 연결 필수 · 화면 기능 구현을 위한 지원 API


        현재 연결 coupleId 범위만. 만료 후 정리된 미작성 주행은 410 또는 삭제 후404. FE 타이머는 서버 activeDurationSeconds를 기준으로 보간하며 PAUSED에서
        정지.
        주행 중 지도는 갱신된 GPS 위치로 차량 마커를 이동시키고 수집한 좌표를 이어 이동선을 표시한다. 경로상 휴게소 마커는 휴게소 조회 데이터로 표시한다.
        이 응답은 거리·시간·마지막 GPS 수신 시각을 제공한다. 두 기기에서 동일한 차량 위치와 이동선을 표시할 때 필요한 좌표 전달 계약은 별도 확정한다.
        GPS 신호가 일정 시간 끊기면 FE가 드라이브 중단 화면을 자동으로 표시한다. 대기 시간과 서버 주행 상태 전이 여부는 별도 확정한다.
        위치 권한이 꺼지면 FE가 권한 안내 팝업을 띄우고, 사용자가 권한을 끈 상태로 두겠다고 확인하면 해당 드라이브 화면에서 나가게 한다.


