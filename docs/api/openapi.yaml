  /auth/authorizations:
    post:
      operationId: startAuthorization
      tags:
      - 인증·회원
      summary: 소셜 로그인 인증 시작
      description: '**상태:** 설계 초안 · **접근:** 공개 · 화면 기능 구현을 위한 지원 API


        카카오 LOGIN 세션을10분간 발급한다. state·허용 redirectUri·LOGIN 목적·서비스 codeChallenge를 서버 세션에 바인딩한다. 브라우저 URL의 토큰을 서비스
        토큰으로 사용하지 않는다. 재인증은 별도 startReauthentication/reauthenticate에서 처리한다. 서비스 세션 결합과 공급자 프로토콜의 지원 여부를 구분하며 카카오
        연동은 실제 검증 후 구현한다.


        **근거:** OFF p15 로그인 화면 · [Figma 13:442](https://www.figma.com/design/iVcryRTtlYHzHq2JM5wyHQ/?node-id=13-442)


