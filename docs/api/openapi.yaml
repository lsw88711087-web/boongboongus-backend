      summary: 회원 탈퇴
      description: '**상태:** 설계 초안 · **접근:** 로그인 필수


        현재 사용자·ACCOUNT_DELETION 목적의5분 X-Reauth-Token이 필수. 준비/진행 주행은409 ACTIVE_DRIVE_EXISTS이며 먼저 종료·취소한다. 카카오 및 연결
        음악 공급자의 권한 해제를 확인한 뒤 계정·전체 세션·푸시를 비활성화하고 현재 커플을 해제한다. 본인 프로필·개인 보관·사연·소감·업로드 접근을 즉시 차단하며 활성 저장소는24시간 안 정리한다.
        탈퇴 회원이 기록 사용자였던 주행의 개별 GPS 좌표도 활성 저장소 정리 대상에 포함한다.
        상대방 작성 원본을 연쇄 삭제하지 않고 공유 접근은 D04로 차단한다. 외부 해제 실패는503 retryable=true, 탈퇴 미완료 상태를 유지하고 증명 유효기간 안 재시도한다.204는
        권한 해제·계정 비활성화 확인 완료이며 파일 후처리 재시도는 서버가 보장한다. 탈퇴 성공 뒤 인증 토큰은 더 이상 사용할 수 없다. 실제 운영 고지·보존 예외 검증은 별도다.


        **근거 구분:** 설계 보완: 회원 생성의 반대 생명주기. 화면 부재만으로 제외할 수 없다. 본인 재인증·카카오 연결 해제·확정된 D21 정책 적용한다.


