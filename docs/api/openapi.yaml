        현재 적용할 정책 버전·확정 기본값·기능 flag를 반환한다. policyStatus=APPROVED는 사용자 승인된 설계 정책이며 실제 서버 구현 완료를 뜻하지 않는다. 승인된 도착 반경100m·체류30초·GPS
        지연900초·게임5문항을 반환한다. 음악은 실제 연동 검증 전 musicPlayback=false이며 FE는 비활성 기능의 호출·진입을 막는다.


        **근거:** OFF p16; ON p8,14,18 · [Figma 289:28352](https://www.figma.com/design/iVcryRTtlYHzHq2JM5wyHQ/?node-id=289-28352)


        **확정 정책:** D14 기술 기본값·코드 형식'
