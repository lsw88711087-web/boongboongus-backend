x-policy-decisions:
- id: D01
  priority: P0
  title: 주행 시작 시점
  sourceIssue: ON p2는 목적지 전 지표를 비워 두며 첫 진입과 실제 GPS 시작의 관계가 미정.
  owner: 프론트·백엔드·기획
  affected: 주행 시작·GPS
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 홈 진입은 PREPARING 준비만 생성하며 시간·GPS 기록을 시작하지 않는다. 목적지와 경로 설정 및 위치 입력이 완료된 뒤 recorder가 start를 호출하면 ACTIVE가
    된다. 목적지 없는 GPS 주행은 허용하지 않는다. 목적지 없는 DJ 생성은 허용하며 기본1시간 분량으로 생성한다.
- id: D02
  priority: P0
  title: 카드 보존·완료 조건
  sourceIssue: ON p16은 입력 내용 자동 임시저장, p17은 사진·소감 중 하나라도 입력하면 저장, p18은 저장 버튼을 누르지 않으면 미작성 배너라고 하여 영구 보존 기준이 혼재.
  owner: 기획·백엔드
  affected: 카드·기록·만료
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 편집 중 제목·사진과 개인 소감 초안은 자동 임시저장하며 상대 알림을 생성하지 않는다. 종료 시각+24시간 안에 ‘저장하기’로 complete가 성공한 카드만 기록 지도·목록에 보존한다.
    complete 조건은 사진1장 이상 또는 submitted=true 소감1개 이상이다. 개인
    초안 소감은 제출 후 complete를 호출한다. 임시저장만 한 미완료 카드는 마감 시 EXPIRED로 전환하고 내용·미참조 사진은24시간 안에 정리한다. 완료 카드도 최초 마감 전까지만 수정
    가능하며 마지막 사진·제출 소감을 모두 제거할 수 없다. 마감 후 편집은 불가하고 완료 카드는 계속 조회한다.
- id: D03
  priority: P0
  title: 도착 판정·수동 종료
  sourceIssue: ON p5와 p15는 도착을 자동 안내하지만 거리·체류시간·GPS 정확도 기준과 수동 종료 시 카드 생성 여부는 미정.
  owner: 기획·백엔드
  affected: 도착·종료
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 서버가 목적지 반경100m 안에서 정확도50m 이하의 GPS를30초 이상 연속 확인하면 ARRIVED를 판정한다. 유효 샘플 간격은 최대15초이며 반경 이탈·품질 미달·간격 초과
    시 체류 타이머를 초기화한다. GPS 부족만으로 자동 도착시키지 않는다. ACTIVE/PAUSED의 USER_ENDED도 카드 작성이 가능하다. PREPARING 취소는 카드가 없다. 서버 종료
    시각과24시간 마감은 최초1회 고정하며 수동 종료를 자동 도착으로 표시하지 않는다.
- id: D04
  priority: P0
  title: 커플 해제·연결 복구 범위
  sourceIssue: OFF p15는 해제 후 기록 접근·재연결 복구 범위 미정. Figma 47:1675는 같은 상대의 이전 이용 이력으로 연결 복구 화면을 제공.
  owner: 기획·백엔드
  affected: 커플·모든 공유 조회
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 커플 해제 시 기존 coupleId의 공유 조회·수정과 공유 링크 접근을 즉시 차단하되 해제만으로 기존 기록을 삭제하지 않는다. 새 상대에게 이전 기록을 노출하지 않는다. 같은 두
    활성 계정이 모두 미연결이고 유효한 상대 코드가 있을 때 가장 최근 해제된 동일 관계를 복구한다. 같은 coupleId·보존된 기록·이름·시작일을 유지하고 버전을 증가시킨다. 삭제·만료된 기록은
    복구하지 않는다. 같은 상대의 이전 이력이 있으면 신규 연결 대신 복구를 사용한다. 탈퇴 계정과의 복구는 불가하다.
- id: D06
  priority: P0
  title: 스탬프 수동 획득·용량
  sourceIssue: ON p7은 GPS 자동·직접 입력과 레벨별5칸 확장을 명시한다. 사용자 최신 결정으로 성장 API9개는 제외됐으므로 도장판 용량의 대체 기준·방문 반경·중복 단위는 미확정.
  owner: 기획·백엔드
  affected: 스탬프
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 스탬프는 coupleId+restAreaId당1개로 누적하며 카드 삭제로 회수하지 않는다. 검색에서 휴게소를 선택한 것만으로 지급하지 않는다. 해당 주행의 서버 수신 GPS가 휴게소
    기준점 반경200m 안이고 정확도50m 이하면 방문 증거로 인정한다. 미확인은 PENDING, 주행 종료+15분까지 지연 증거를 재검증한 뒤 없으면 REJECTED로 확정한다. 수동 입력과 자동
    입력에 같은 검증을 적용한다. 도장판은 전체 카탈로그를 사용하며 레벨 잠금·초기화가 없다.
- id: D07
  priority: P0
  title: 게임 입력 주체·진행 조건
  sourceIssue: ON p12의 두 사람 응답 조건과 한 명 응답 예외가 충돌. ON p13은 추억 게임 객관 채점 없음, 넌센스 점수 기록 방식은 미정.
  owner: 프론트·백엔드·기획
  affected: 게임 입력·진행·종료
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 각 사용자는 본인 기기·인증으로 본인 응답만 저장한다. 게임은 세트당5문항이다. 밸런스는 최소1명 응답 후 다음 문항, 넌센스는 정답 공개 후 다음 문항, 추억은 응답 없이 PASS로
    진행 가능하다. 마지막 문항의 동일 진행 조건을 충족해야 complete가 가능하고 중도 종료는 ABANDONED다. 주행 종료 시 진행 중 게임은 ABANDONED로 정리한다. 넌센스 자기 채점·객관
    점수·업적/보상은 제공하지 않는다.
- id: D08
  priority: P0
  title: 공유 기록 삭제 범위
  sourceIssue: OFF p11은 공동 작성 카드를 삭제할 때 상대방에서도 삭제되는지 미정.
  owner: 기획·백엔드
  affected: 공동 카드 삭제·기록 개수
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 연결된 두 멤버 중 한 명이 카드를 삭제하면 같은 카드가 양쪽의 목록·지도·공유 링크에서 즉시 사라진다. 완료 카드 수·기록 개수·해당 완료 기록 기준 누적 거리도 함께 갱신한다.
    카드는 되살리지 않으며 사진은 참조가 모두 사라진 경우에만24시간 안에 물리 정리한다. 다른 카드·사용자가 참조하는 원본이나 누적 휴게소 스탬프는 삭제하지 않는다.
    카드 삭제 시 해당 주행의 개별 GPS 좌표를 삭제한다.
- id: D09
  priority: P0
  title: 카카오 인증·가입 동의
  sourceIssue: 사용자가 2026-11-06 카카오 로그인만 제공한다고 확정. PDF는 로그인 세부 프로토콜이 없고 Figma는 가입·동의 화면 제공.
  owner: 인증 담당·프론트
  affected: 인증·온보딩
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 앱 로그인은 카카오만 제공한다. 로그인과 본인 재인증의 세션·목적·사용자·state·허용 redirectUri·서비스 PKCE 증명을 분리하고 코드는1회 소비한다. 인증 세션10분,
    서비스 access token30분, refresh token14일이며 갱신 시 회전한다. 동일 멱등키 갱신 재시도 창은30초, 재사용 의심 시 세션을 폐기한다. 탈퇴 증명은 현재 사용자·ACCOUNT_DELETION에
    바인딩하고5분 유효하며 성공한 탈퇴에서1회 소비한다. 필수 동의는 현재 버전 TERMS·PRIVACY 두 종류이며 오픈소스는 고지, OS 위치 권한은 별도 처리한다.
- id: D10
  priority: P0
  title: 음악 재생 방식·범위
  sourceIssue: ON p9는 곡 탭 시 한 곡만 재생, 전체 재생은 별도. p10은 공급자 재생 방식·제어 범위가 미정.
  owner: 기획·외부 연동 담당
  affected: DJ·재생
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: PLAY+TRACK는 선택 곡1개만, PLAY+PLAYLIST는 목록 전체를 재생한다. 재생 방식은 연결의 canPlayInApp/canControlPlayback capability로
    선택하며 SDK 재생과 서버 명령을 중복 실행하지 않는다. 공급자 미연동 단계는 musicPlayback=false로 두고 생성·조회·보관만 제공한다. 음악 연결4개와 실제 재생은 공급자 지원·구독·기기·토큰
    연동 검증을 통과할 때 활성화한다. SPOTIFY는 예시이며 채택을 확정하지 않는다. SEEK는 제공하지 않고 음악 OAuth는 앱 로그인 공급자를 추가하지 않는다.
- id: D12
  priority: P1
  title: 알림·실시간 전달
  sourceIssue: ON p17 상대 소감 알림 명시, 전송 수단·중복 알림·기타 이벤트 상세 미정.
  owner: 프론트·백엔드
  affected: 알림·동기화·카드
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 인앱 알림을 원본으로 저장하고 푸시는 부가 전송한다. 앱 복귀 시 즉시, 활성 화면에서는30초 간격으로 재조회하며 백그라운드 자동 조회는 중단한다. 같은 이벤트는 서버 유일키와 알림
    ID로 중복을 방지한다. 소감 알림은 본인 소감 최초 제출에만 생성한다. 카드 완료 알림은 ‘저장하기’로 처음 COMPLETED가 될 때 카드당 한 번 생성하고 수신 등록된 상대 기기에 푸시를 발송한다.
    알림은30일 보존하며 WebSocket/SSE는 이번 범위에서 제공하지 않는다. 성장·업적 알림은 제외한다.
- id: D13
  priority: P1
  title: 장소·휴게소 외부 데이터
  sourceIssue: ON p5-7 경로 재탐색, 메뉴 사진 수급, 휴게소 상세 제외 가능성이 미정.
  owner: 기획·외부 연동 담당
  affected: 검색·지도·휴게소
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 외부 provider ID는 내부 ID로 매핑한다. 주소·메뉴·사진 등 선택 정보가 없으면 null 또는 빈 배열과 기능 flag를 반환한다. 데이터가 없는 휴게소 상세 진입은 비활성화하고
    장애를 정상 데이터로 꾸미지 않는다. 좌표→주소는 백엔드 API를 기본 사용한다. 장소/경로·메뉴 공급자의 계정·키·이용 범위는 구현 검증 항목이며 경로 음성 안내는 이번 범위에서 제외한다. 휴게소
    접근 알림은 검증된 경로상 남은 거리2km 이내에서 동일 주행·휴게소당 최초1회 제공한다.
- id: D14
  priority: P1
  title: 기술 기본값·코드 형식
  sourceIssue: 문서는 페이지 크기·닉네임/제목/파일 한도·토큰 TTL·초대 코드 형식/만료·업무 시간대·GPS 지연 허용시간을 확정하지 않음. Figma 코드 예시는 7자·8자가 혼재.
  owner: 프론트·백엔드
  affected: 공통 규약
  status: CONFIRMED
  confirmedBy: USER
  confirmedAt: '2026-11-07'
  decision: 페이지 기본20/최대100, 닉네임·붕붕이 이름 trim 후1~20자, 주행 제목 최대50자, 업로드 파일당10MiB 및 JPEG/PNG/WebP를 허용한다. 업무 날짜는 Asia/Seoul,
    저장·전송 시각은 UTC다. GPS 배치 최대200개, 종료 후15분까지 종료 이전 ACTIVE 구간의 지연 좌표를 허용한다. 일반 멱등키 보존24시간, refresh 회전 재시도만30초다. 초대는
    본인당 유효1개·24시간 만료이며 FE는 코드를 불투명 문자열로 다루고 길이8자를 강제하지 않는다. 서버는 trim·대소문자 무시로 비교하며 공백만인 코드는 거절한다. 폐기 후 재발급은 새 멱등키를
    사용한다. 업로드 URL10분, 미첨부 파일24시간 만료, 정리 작업1시간 간격으로 두며 첨부·삭제 경쟁은 트랜잭션으로 검증한다. 경유지 최대3개·플레이리스트 최소1곡을 적용한다. 라디오 보관함은
    본인 USER_STORY만 자동 보관하고 RANDOM 결과는 보관함에서 제외한다.
- id: D15
  priority: P1
  title: 사진 없는 기록·지도 그룹
  sourceIssue: ON p17은 첫 사진 대표를 명시. OFF p8-10은 사진 없는 기록의 기본 이미지와 지도 겹침·날짜 필터 일부 미정.
  owner: 프론트·기획
  affected: 기록 지도
  status: CONFIRMED
