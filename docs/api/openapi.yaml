    post:
      operationId: createRoute
      tags:
      - 홈·장소
      summary: 경로 미리보기 계산
      description: '**상태:** 설계 초안 · **접근:** 로그인 필수 · 화면 기능 구현을 위한 지원 API


        좌표·목적지·최대3개 경유지로 계산한다. 경로 계산은 GPS 주행 시작이 아니다. 카카오모빌리티 자동차 길찾기를 실시간 호출한다. 우리 장소 ID 또는 직접 입력한 좌표를 사용하며 카카오맵 실시간 검색 결과는 저장 가능한 목적지로 등록하지 않는다. 자유 좌표의 이름·주소에는 카카오 조회값을 복사하지 않고 사용자 직접 입력값만 보낸다. 동일한 멱등키는 같은 routeId를 사용하고 경로선·거리·예상 시간은 재계산한다. 실제 공급자가 경유지를 지원하지 않으면422 WAYPOINT_UNSUPPORTED이며 FE가 성공 경로로
        꾸미지 않는다. 음성 길안내는 이번 범위에 없다.

        현재 위치를 출발지로 쓰려면 요청에 최신 GPS 좌표를 보낸다. trafficSummary는 같은 카카오 응답에서 계산한 선택 경로의 교통 상태다.


