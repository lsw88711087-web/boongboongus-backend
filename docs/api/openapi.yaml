  /drives/{driveId}/gps-batches:
    post:
      operationId: uploadGpsBatch
      tags:
      - 주행·GPS
      summary: GPS 좌표 묶음 업로드
      description: '**상태:** 설계 초안 · **접근:** 현재 커플 연결 필수 · 화면 기능 구현을 위한 지원 API


        recorderUserId만 최대200개/회 전송한다. 주행 내 sequence 중복은 재집계하지 않는다. 일부 거절도200이므로 accepted/duplicate/rejected를 확인한다.
        GPS 시퀀스가 중간에 누락되어도 FE는 누락된 좌표를 기다리지 않고 이후 좌표를 전송한다. 서버는 이후 유효한 좌표를 반영하며 highestContiguousSequence는 1번부터 연속으로 반영한 마지막 번호를 반환한다.
        정확도50m 초과는 ACCURACY_TOO_LOW. 기록 시각이 실제 ACTIVE 구간에 속해야 하며 PAUSED 구간은 집계하지 않는다. 종료 후900초 이내에만 종료 이전 좌표를 반영하고
        이후는 LATE_UPLOAD_WINDOW_CLOSED. GPS 갱신은 controlVersion·카드 편집 마감/버전을 늘리지 않는다. 도착 검증은 반경100m·30초 체류이며 검증된 최신 GPS 기준으로 앞으로 남은 경로 거리가 2km 이내인 휴게소는 restAreaAlerts에 주행·휴게소당 한 번 제공한다.
        FE는 알림 id로 중복 표시를 방지한다. GPS 저장은 길찾기 공급자의 장애와 독립적으로 처리한다.


