  confirmedAt: '2026-11-07'
  decision: 첫 사진을 대표로 사용하고 사진이 없으면 공통 기본 일러스트를 FE에서 표시한다. 목적지 그룹은 내부 placeId 우선, 없으면 소수점5자리로 정규화한 좌표를 사용한다. 같은 그룹은
    최신 driveDate·cardId 기준 대표 카드와 recordCount를 반환하고 +N은 recordCount-1이다. 날짜는 시작 시각의 한국 날짜를 사용한다. 날짜 필터는 검색창 지우기로
