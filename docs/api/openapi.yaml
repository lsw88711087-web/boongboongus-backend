x-implementation-verifications:
- id: V01
  status: NOT_VERIFIED
  title: 음악 공급자·SDK/서버 제어 연동
  rule: D10 정책은 확정. 실제 공급자·구독·토큰·재생 제어 검증 전 musicPlayback=false. 공급자는 아직 선택되지 않았다.
- id: V02
  status: NOT_VERIFIED
  title: GPS 도착·휴게소 반경의 실제 기기 검증
  rule: D03/D06 기본값100m·30초·50m, 휴게소200m는 확정 설계값. 실제 도로·건물·백그라운드 GPS로 검증하고 조정 시 policyVersion을 올린다.
- id: V03
  status: NOT_VERIFIED
  title: 외부 계정·운영 고지·실제 업무 API 구현
  rule: 카카오·지도·메뉴·푸시 연동과 탈퇴 실패 복구, 실제 개인정보/약관 고지·보존 예외는 구현·운영 검증 전. 기능명세를 법률 문안으로 간주하지 않는다.
