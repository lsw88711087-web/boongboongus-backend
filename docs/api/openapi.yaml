  /cards/{cardId}/complete:
    post:
      operationId: completeCard
      tags:
      - 카드·기록
      summary: 카드 저장 완료·상대방 알림
      description: '**상태:** 설계 초안 · **접근:** 현재 커플 연결 필수


        마감 전 사진1장 또는 submitted=true 소감1개 이상이면 UNWRITTEN/DRAFT→COMPLETED로 전환한다. 개인 초안 소감은 먼저 saveMyReflection submitted=true를
        저장한다. 상대방 소감은 필수 아님. 성공 시 배너 제거·기록 노출. 임시저장만 하고 complete를 안 한 카드는24시간 마감 시 EXPIRED 및 내용 정리 대상이다. 완료 후에도
        최초 마감 전까지만 수정하며 마감은 연장하지 않는다.
        ‘저장하기’로 처음 COMPLETED가 되면 서버가 저장한 사람의 커플 상대를 수신자로 결정한다. 카드 완료와 CARD_COMPLETED 인앱 알림·푸시 발송 이벤트를 같은 트랜잭션에 기록한다.
        저장 확정 후 수신 등록된 상대 기기에 푸시를 발송한다. 푸시 실패나 수신 기기 미등록 시에도 카드와 인앱 알림은 유지한다.
        같은 카드의 완료 알림은 한 번만 생성하며, 재요청·동시 요청·완료 후 편집으로 다시 발송하지 않는다.


        **근거:** ON p15-18; OFF p2,10 · [Figma 289:18871](https://www.figma.com/design/iVcryRTtlYHzHq2JM5wyHQ/?node-id=289-18871),
