          type: string
          example: sehdFok_fW~dAg}QfxGzoN
          description: Google encoded polyline precision 5, 위도·경도 순. 경로 좌표는 WGS84. 예시는 디코딩 가능한 가상 경로이며 실제 도로 탐색
