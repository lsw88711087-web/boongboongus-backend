          type: string
          example: '2026-11-02T07:00:00Z'
          description: ''
          format: date-time
        expiresAt:
          type: string
          example: '2026-11-02T07:30:00Z'
          description: ''
          format: date-time
        provider:
          type: string
          example: KAKAO
          description: ''
        trafficSummary:
          type: [object, 'null']
          description: >-
            선택 경로의 도로 구간 거리를 카카오 교통 상태별로 합산한다.
            4는 원활, 2·3은 서행, 1은 정체로 분류한다.
            합산 거리가 가장 긴 상태를 선택하고 동률이면 더 나쁜 상태를 우선한다.
            6이 있는 경우 통행 불가를 우선한다. 그 외에는 유효한 교통 정보의 합산 거리가 전체 경로의 50% 미만이면 null이다.
            정보 없음(0), 미지원 상태, 거리 누락 및 0 이하인 구간은 거리 합산에서 제외한다.
          properties:
            status:
              type: string
              enum: [SMOOTH, SLOW, CONGESTED, BLOCKED]
              description: 각각 원활, 서행, 정체, 통행 불가.
            congestedDistanceMeters:
              type: integer
              minimum: 0
              description: 교통 상태가 정체(1)인 구간의 합산 거리(m).
          required: [status, congestedDistanceMeters]
          additionalProperties: false
        warnings:
          type: array
          items:
            type: string
            example: 경로 제공자가 지원하지 않는 옵션은 별도 안내
            description: ''
          description: ''
      required:
      - id
      - origin
      - destination
      - waypoints
      - polyline
      - distanceMeters
      - durationSeconds
      - estimatedArrivalAt
      - expiresAt
      - provider
      - trafficSummary
      - warnings
      additionalProperties: false
      description: ''
