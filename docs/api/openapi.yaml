x-integration-flows:
- title: 로그인·온보딩
  sequence: getAppConfig -> startAuthorization -> exchangeSocialCode -> getMe -> completeOnboarding
  note: 허용된 소셜 공급자 사용, 필수 동의 버전 검증
- title: 커플 연결
  sequence: getMyCouple -> createCoupleInvite / joinCouple -> getHome
  note: 코드 화면은 code만 입력. 공동 이름·시작일 초기값은 D20. 복구 화면은 restoreCoupleConnection 별도 사용.
- title: 홈·추천·상세
  sequence: getHome -> getCategories -> getRecommendations -> getPlace -> createRoute
  note: OS 위치 없으면 null fallback, GPS 허용 팝업은 FE
- title: 장소 공유·알림
  sequence: sendPlaceToPartner -> getNotifications -> markNotificationRead -> getPlace
  note: 외부 앱 공유는 getPlaceShareLink+네이티브 공유
- title: 주행 시작
  sequence: prepareDrive -> createRoute -> updateDrive -> startDrive -> uploadGpsBatch
  note: 실제 출발 시점 D01 합의, 커플 1건/기기1개 기록
- title: 중단·재개
  sequence: pauseDrive -> resumeDrive -> uploadGpsBatch
  note: 새 controlVersion 반영, 중단구간 좌표/시간 합산 금지
- title: 휴게소·스탬프
  sequence: getDriveRestAreas -> getRestArea -> claimStamp -> [PENDING이면 getStampClaim] -> getStampBook
  note: 수동 입력도 서버검증 전 획득 확정 금지. recheckUntil 도달 또는 기한 미정이면 무한 polling 금지
- title: 도착·카드
  sequence: endDrive -> getDriveCard -> createMediaUpload -> [스토리지 PUT] -> completeMediaUpload -> saveCardDraft
    -> saveMyReflection -> completeCard
  note: 편집 중 제목·사진과 미제출 소감은 알림 없이 자동 임시저장. ‘저장하기’는 completeCard를 호출하고 최초 완료 시 상대에게 CARD_COMPLETED 인앱 알림과 푸시를 보낸다.
    소감만 있으면 업로드 단계 생략. 내 소감으로 완료하려면 submitted=true 저장 후 completeCard 호출.
- title: 미작성 복귀
  sequence: getHome -> getCard -> saveCardDraft / saveMyReflection -> completeCard
  note: 마감은 endedAt+24h 그대로. 410이면 편집 종료
- title: 기록지도·달력
  sequence: getRecords / getRecordMap -> getRecordCalendar -> getCard -> getCardShareLink
  note: COMPLETED만, 날짜/검색/목적지 그룹과 cursor 사용
- title: DJ 생성·편집
  sequence: createPlaylist -> getJob 반복 -> getPlaylist -> updatePlaylistTracks -> savePlaylist
  note: 분위기/날씨 필수, 화면 이탈 시 명시 cancelJob
- title: 음악 재생
  sequence: attachPlaylistToDrive -> commandPlayback 또는 SDK -> getPlayback
  note: 한 곡=PLAY+TRACK, 전체=PLAY+PLAYLIST. 공급자 범위 D10 확인. SDK와 서버 명령 중복 호출 금지.
- title: 라디오
  sequence: createRadioEpisode -> getJob 반복 -> getRadioEpisode -> 로컬 TTS 재생
  note: 최대300자, 화면을 뒤로가도 앱 오디오 상태 유지
- title: 게임
  sequence: createGameSession -> getJob -> getGameSession -> saveGameResponse / revealHint / revealAnswer -> nextGameQuestion
    -> completeGameSession
  note: 밸런스·추억 선택, 넌센스 힌트·정답 공개. 입력 주체 D07 합의. 점수·자기 채점·별도 보상 기능 없음.
- title: 마이·보관함
  sequence: getMe / getMyCouple / getFavorites / getPlaylistLibrary / getRadioHistory
  note: 각 자산의 개인/커플 소유권 분리
- title: 연결 해제·로그아웃
  sequence: disconnectCouple / logout
  note: 두 기능은 별개, 로그아웃으로 기록·마감 초기화하지 않음
- title: 내 위치 주소
  sequence: 기기 GPS -> reverseGeocode -> createRoute
  note: GPS 권한·위치 확보는 FE. 주소 조회 실패는 --/기본 문구로 표시.
- title: 붕붕이 이름 변경
  sequence: getMyCouple -> updateCoupleMascotName -> getHome
  note: Couple.version을 사용하고 홈과 커플 페이지 이름을 함께 갱신.
- title: 이전 커플 연결 복구
  sequence: restoreCoupleConnection -> getMyCouple -> getHome
  note: 같은 두 사람의 이력 확인. 기존 기록 복구 범위 D04 승인 후 활성화.
- title: 보관함 저장 취소
  sequence: unsavePlaylist -> getPlaylistLibrary
  note: 개인 보관 링크만 제거. 원본과 주행 스냅샷 보존.
- title: 사진 삭제·업로드 취소
  sequence: saveCardDraft / deleteTemporaryMedia
  note: 첨부 사진 제거는 전체 photoIds PATCH. 미첨부 본인 업로드만 DELETE. 서버 미참조 정리를 병행.
- title: 초대 폐기·재발급
  sequence: revokeInvite -> createCoupleInvite
  note: 사용된 초대는 커플 해제로 처리하지 않는다. 새 발급 의도는 새 멱등키. 초대 상태 경쟁은 서버 검증.
- title: 회원 탈퇴
  sequence: startReauthentication -> reauthenticate -> deleteAccount
  note: 카카오 본인 확인, X-Reauth-Token 전달. D21 확정 정책 적용. 로그아웃·커플 해제와 구분.
- title: 조건부 음악 계정 연결
  sequence: startMusicAuthorization -> connectMusicProvider -> getMusicConnection -> commandPlayback / disconnectMusic
  note: D10 확정 정책과 실제 연동 검증을 충족할 때 활성화. canControlPlayback 검증, SDK/서버 중복 제어 금지.
